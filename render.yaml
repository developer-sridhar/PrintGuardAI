services:
  - type: web
    name: printguard-ai-engine
    env: python
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free

  - type: web
    name: printguard-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: printguard-ai-engine
          property: hostpath
