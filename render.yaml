services:
  - type: web
    name: printguard-ai-engine
    env: python
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

  - type: web
    name: printguard-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
